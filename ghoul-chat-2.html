<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghoul Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8e6;--pan:#fffdf5;--acc:#e8a76c;--yel:#fdd671;--txt:#4a3728;--mut:#9b8672;--me:#fdd671;--him:#fff;--line:#ecdcb4;--vinyl:#5a4635}
[data-t=dark]{--bg:#1e1a17;--pan:#2a2420;--acc:#e8a76c;--yel:#4a3a2c;--txt:#f5e9d3;--mut:#a89580;--me:#7a5a3a;--him:#3a322c;--line:#3d342d;--vinyl:#e8a76c}
[data-t=ghoul]{--bg:#0d0d10;--pan:#17171c;--acc:#d7263d;--yel:#2a1418;--txt:#f1eaea;--mut:#8b7f84;--me:#8f1d2c;--him:#24242b;--line:#2b2b33;--vinyl:#d7263d}
[data-t=wa]{--bg:#efeae2;--pan:#fff;--acc:#25d366;--yel:#d9fdd3;--txt:#111b21;--mut:#667781;--me:#d9fdd3;--him:#fff;--line:#e9edef;--vinyl:#128c7e}
*{box-sizing:border-box;margin:0;padding:0;font-family:Montserrat,system-ui,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--txt);font-size:14px}
.hide{display:none!important}
button{font:inherit;color:inherit}
.scr{position:fixed;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;overflow:auto}
.wv{position:absolute;width:min(360px,80vw);aspect-ratio:8/5;pointer-events:none}
.wv.t{top:0;left:0}.wv.b{bottom:0;right:0;transform:rotate(180deg)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;position:relative}
.logo{font-weight:700;font-size:46px;line-height:1;color:var(--acc);letter-spacing:1px;text-align:center}
.logo svg{width:.85em;height:.85em;vertical-align:-.08em}
.logo small{display:block;font-size:14px;color:var(--txt);letter-spacing:0;margin-top:4px}
.card{position:relative;background:var(--yel);border-radius:28px 28px 0 0;padding:28px 24px 30px}
.card h1{font-size:24px;margin-bottom:6px}.card p{color:var(--mut);font-size:12px;margin-bottom:18px}
.btn{border:0;border-radius:10px;padding:12px 20px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
.btn.g{background:#fff;color:#333;width:100%;display:flex;gap:10px;justify-content:center;align-items:center}
.in{width:100%;padding:12px;border:1.5px solid var(--vinyl);border-radius:8px;background:transparent;color:var(--txt);outline:0;margin-bottom:12px}
.cr{font-size:11px;color:var(--mut);text-align:center;margin-top:14px}
.f{width:100%;max-width:320px}.f .btn{width:100%;margin-bottom:8px}.f .btn.o{background:none;color:var(--mut)}
#dp{width:96px;height:96px;border-radius:50%;background:var(--yel);display:grid;place-items:center;font-size:30px;cursor:pointer;overflow:hidden;border:3px solid var(--acc)}
#dp img{width:100%;height:100%;object-fit:cover}
#app{height:100dvh;display:grid;grid-template-columns:100%;position:relative;overflow:hidden}
#side{display:flex;flex-direction:column;min-height:0;background:var(--pan);border-right:1px solid var(--line)}
#side header{display:flex;align-items:center;gap:12px;padding:16px}
#side h2{flex:1;font-size:20px}
#q{margin:0 16px 10px;width:auto}
h5{padding:6px 16px;color:var(--mut);font-size:12px}
.strip{display:flex;gap:14px;overflow-x:auto;padding:0 16px 10px}.strip:empty{display:none}
.on{text-align:center;cursor:pointer}.on small{display:block;font-size:11px;margin-top:4px}
.on .av{width:56px;height:56px}
.tabs{display:flex;gap:8px;padding:4px 16px 8px}.tabs b{padding:6px 16px;border-radius:20px;cursor:pointer;color:var(--mut)}.tabs b.a{background:var(--acc);color:#fff}
#list{flex:1;overflow:auto}
.row{display:flex;gap:12px;align-items:center;padding:10px 16px;cursor:pointer}.row:hover,.row.a{background:var(--yel)}
.row small,#hs{color:var(--mut)}
.av{position:relative;width:46px;height:46px;flex:none;border-radius:50%;background:var(--yel);display:grid;place-items:center;font-weight:700;color:var(--vinyl);border:2px solid var(--acc)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:#2ecc71;border:2px solid var(--pan)}
.mut{padding:20px;color:var(--mut);text-align:center}
footer{padding:8px;text-align:center;font-size:11px;color:var(--mut)}
#main{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s}
#app.open #main{transform:none}
#empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mut)}
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
#ch{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--pan);border-bottom:1px solid var(--line)}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:8px 12px;border-radius:14px 14px 14px 4px;background:var(--him);align-self:flex-start;word-break:break-word;box-shadow:0 1px 2px #0002}
.m.me{align-self:flex-end;background:var(--me);border-radius:14px 14px 4px 14px}
.m img{max-width:100%;border-radius:8px;display:block}.m a{color:inherit}.m audio{max-width:220px}
.m .sn{display:block;font-size:11px;color:var(--acc)}.m .t{font-size:10px;color:var(--mut);text-align:right;margin-top:2px}
.m.stk{font-size:64px;line-height:1.1;background:none;box-shadow:none;padding:0}
#bar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--pan)}
#bar .in{margin:0;border-radius:22px;border-color:var(--line);background:var(--bg)}
.ib{background:none;border:0;font-size:22px;cursor:pointer;width:40px;height:40px;flex:none}
.snd{background:var(--acc);color:#fff;border-radius:50%;font-size:16px}
.rc{background:#e74c3c;border-radius:50%;animation:p 1s infinite}@keyframes p{50%{opacity:.5}}
#ep{display:none;max-height:200px;overflow:auto;padding:8px 12px;background:var(--pan);border-top:1px solid var(--line)}#ep.on{display:block}
#ep span{font-size:24px;cursor:pointer;padding:4px;display:inline-block}#ep .s{font-size:40px}#ep h4{font-size:11px;color:var(--mut);margin:6px 0}
#md{position:fixed;inset:0;background:#0007;z-index:20;display:grid;place-items:center}
#md>div{background:var(--pan);border-radius:20px;padding:20px;width:min(340px,90vw);max-height:80vh;overflow:auto}
#md h3{margin-bottom:12px}#md .btn{width:100%;margin-top:12px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line)}
#hi small{color:var(--mut);font-weight:400;font-size:11px}
#cl{position:fixed;inset:0;z-index:30;background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#lv{position:absolute;right:14px;top:14px;width:96px;height:130px;object-fit:cover;border-radius:12px;background:#000;z-index:2;display:none}#cl.vid #lv{display:block}
#ci{position:relative;text-align:center;z-index:1}#ci .av{width:110px;height:110px;margin:0 auto 12px;font-size:40px}#ci h3{font-size:22px}#cl.vid.live #ci{display:none}
#cb{position:absolute;bottom:40px;display:flex;gap:22px;z-index:3}
.cbt{width:60px;height:60px;border-radius:50%;border:0;font-size:24px;background:#333;cursor:pointer}.cbt.g{background:#2ecc71}.cbt.r{background:#e74c3c}
@media(min-width:820px){#app{grid-template-columns:380px 1fr}#main{position:static;transform:none}#bk{display:none}}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="w" viewBox="0 0 320 200"><path d="M-10 70C70 0 130 150 230 70S320 30 340 10" fill="none" style="stroke:var(--yel)" stroke-width="38"/><path d="M-10 115C70 45 130 195 230 115S320 75 340 55" fill="none" style="stroke:var(--acc)" stroke-width="18"/></symbol>
<symbol id="v" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" style="fill:var(--vinyl)"/><circle cx="50" cy="50" r="18" style="fill:var(--yel)"/><circle cx="50" cy="50" r="5" style="fill:var(--bg)"/></symbol>
</defs></svg>

<div id="login" class="scr hide">
  <svg class="wv t"><use href="#w"/></svg><svg class="wv b"><use href="#w"/></svg>
  <div class="mid"><div class="logo" aria-label="Ghoul Chat">GH<svg><use href="#v"/></svg>UL<small>chat</small></div></div>
  <div class="card"><h1>Welcome!</h1><p>Drop the needle on your conversations. Sign in to start chatting.</p>
    <button class="btn g" id="gbtn"><b style="color:#4285f4;font-size:18px">G</b> Sign in with Google</button>
    <div class="cr">Ghoul Chat · created by developer Shoeb</div></div>
</div>

<div id="setup" class="scr hide">
  <svg class="wv t"><use href="#w"/></svg><svg class="wv b"><use href="#w"/></svg>
  <div class="mid">
    <div class="logo" style="font-size:32px">GH<svg><use href="#v"/></svg>UL</div>
    <h2>Set up your profile</h2>
    <div id="dp"></div><small>Tap to pick a photo (auto-cropped to 1:1)</small><b id="myid" style="color:var(--acc)"></b>
    <div class="f"><input class="in" id="nm" placeholder="Your name"><input class="in" id="ph" placeholder="Phone number (optional, for search)" inputmode="tel">
      <button class="btn" id="sv">Save profile</button><button class="btn o hide" id="cn">Cancel</button><button class="btn o" id="lo">Log out</button></div>
    <input type="file" id="dpf" accept="image/*" hidden>
  </div>
</div>

<div id="app" class="hide">
  <aside id="side">
    <header><div id="mav" style="cursor:pointer"></div><h2 id="hi"></h2><button class="ib" id="thm" title="Change theme">🎨</button></header>
    <input class="in" id="q" placeholder="Search by name, number or ID">
    <h5 id="ol" class="hide">Online now</h5><div class="strip" id="onl"></div>
    <div class="tabs"><b class="a" data-k="c">Chats</b><b data-k="g">Groups</b></div>
    <div id="list"></div>
    <footer>Ghoul Chat · created by developer Shoeb</footer>
  </aside>
  <main id="main">
    <div id="empty"><div class="logo" style="font-size:36px">GH<svg><use href="#v"/></svg>UL<small>chat</small></div>Pick someone to start chatting</div>
    <section id="chat" class="hide">
      <div id="ch"><button class="ib" id="bk">←</button><div id="ha"></div><div style="flex:1;min-width:0"><b id="hn"></b><br><small id="hs"></small></div><button class="ib clb" id="c1" title="Voice call">📞</button><button class="ib clb" id="c2" title="Video call">🎥</button></div>
      <div id="msgs"></div><div id="ep"></div>
      <div id="bar"><button class="ib" id="emo">😊</button><button class="ib" id="att">📎</button>
        <input class="in" id="mi" placeholder="Type a message" autocomplete="off">
        <button class="ib" id="mic">🎤</button><button class="ib snd hide" id="snd">➤</button></div>
      <input type="file" id="fl" hidden>
    </section>
  </main>
</div>
<div id="cl" class="hide"><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video>
<div id="ci"><div id="cav"></div><h3 id="cnm"></h3><small id="cs"></small></div>
<div id="cb"><button class="cbt g" id="cok">📞</button><button class="cbt" id="mt">🎙️</button><button class="cbt r" id="cno">📵</button></div></div>
<div id="md" class="hide"><div></div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getDatabase,ref,onValue,push,set,update,get,onDisconnect,serverTimestamp,onChildAdded,query,limitToLast,runTransaction}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app=initializeApp({apiKey:"AIzaSyCTx5Vq1fXL4wQn_fmhaZfE3Aobl9X3LYM",authDomain:"chatting-8e283.firebaseapp.com",databaseURL:"https://chatting-8e283-default-rtdb.firebaseio.com",projectId:"chatting-8e283",storageBucket:"chatting-8e283.firebasestorage.app",messagingSenderId:"357657167957",appId:"1:357657167957:web:7e699874b75b8b5b236cdc"});
const auth=getAuth(app),db=getDatabase(app);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=t=>t?new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
const show=id=>['login','setup','app'].forEach(x=>$('#'+x).classList.toggle('hide',x!==id));
let uid,me,users={},groups={},tab='c',cur=null,off=null,rec=null,started=0,dp='';

/* theme */
const setT=t=>{document.documentElement.dataset.t=t;try{localStorage.gt=t}catch{}};
setT((()=>{try{return localStorage.gt}catch{}})()||'retro');
const md=$('#md'),modal=h=>{md.firstElementChild.innerHTML=h;md.classList.remove('hide')};
md.onclick=e=>{if(e.target===md)md.classList.add('hide')};
$('#thm').onclick=()=>{
  modal('<h3>Change theme</h3>'+[['retro','Retro Vinyl','#fdd671'],['dark','Dark Brown','#2a2420'],['ghoul','Ghoul Red','#d7263d'],['wa','Classic Green','#25d366']].map(([k,n,c])=>`<div class="row" data-k="${k}"><i class="sw" style="background:${c}"></i>${n}</div>`).join(''));
  $$('#md .row').forEach(r=>r.onclick=()=>{setT(r.dataset.k);md.classList.add('hide')});
};

/* helpers */
const av=u=>`<div class="av">${u.photo?`<img src="${u.photo}">`:esc((u.name||'?')[0].toUpperCase())}${u.online?'<i class="dot"></i>':''}</div>`;
const b64=f=>new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)});
const img=(f,m,sq)=>new Promise(r=>{const i=new Image;i.onload=()=>{const s=sq?Math.min(i.width,i.height):0,w=s||i.width,h=s||i.height,k=Math.min(1,m/(s||Math.max(i.width,i.height))),c=document.createElement('canvas');c.width=w*k;c.height=h*k;c.getContext('2d').drawImage(i,sq?(i.width-s)/2:0,sq?(i.height-s)/2:0,w,h,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.85))};i.src=URL.createObjectURL(f)});
const newId=async()=>{for(;;){const id=String(10000+Math.floor(Math.random()*90000));if((await runTransaction(ref(db,'ids/'+id),c=>c===null?uid:undefined)).committed)return id}};

/* auth + profile */
$('#gbtn').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>alert(e.message));
onAuthStateChanged(auth,async u=>{
  if(!u)return show('login');
  uid=u.uid;me=(await get(ref(db,'users/'+uid))).val();
  if(me?.name)start();else{me={name:u.displayName||'',photo:'',email:u.email};openSetup(me)}
});
const paintDp=()=>$('#dp').innerHTML=dp?`<img src="${dp}">`:'📷';
function openSetup(u){$('#myid').textContent=u.id?'Your ID: '+u.id:'Your unique ID is created automatically when you save';$('#nm').value=u.name||'';$('#ph').value=u.phone||'';dp=u.photo||'';paintDp();$('#cn').classList.toggle('hide',!me?.name);show('setup')}
$('#dp').onclick=()=>$('#dpf').click();
$('#dpf').onchange=async e=>{const f=e.target.files[0];if(f){dp=await img(f,256,1);paintDp()}};
$('#sv').onclick=async()=>{
  const n=$('#nm').value.trim();if(!n)return alert('Enter your name');
  const d={name:n,phone:$('#ph').value.trim(),photo:dp,email:auth.currentUser.email||''};
  if(!me.id)d.id=await newId();await update(ref(db,'users/'+uid),d);me={...me,...d};start();
};
$('#cn').onclick=()=>show('app');
$('#lo').onclick=async()=>{try{await update(ref(db,'users/'+uid),{online:false,last:serverTimestamp()})}catch{}await signOut(auth);location.reload()};
$('#mav').onclick=()=>openSetup(me);

async function start(){
  show('app');if(!me.id){me.id=await newId();await update(ref(db,'users/'+uid),{id:me.id})}$('#hi').innerHTML='hi, '+esc(me.name.split(' ')[0])+'<br><small>ID '+me.id+'</small>';$('#mav').innerHTML=av(me);
  if(started)return;started=1;
  onValue(ref(db,'.info/connected'),s=>{if(!s.val())return;const p=ref(db,'users/'+uid);onDisconnect(p).update({online:false,last:serverTimestamp()}).then(()=>update(p,{online:true}))});
  onValue(ref(db,'users'),s=>{users=s.val()||{};render();hdr()});
  onValue(ref(db,'groups'),s=>{groups=s.val()||{};render();hdr()});
  onValue(ref(db,'calls/'+uid),s=>{const d=s.val();
    if(d?.st==='ring'&&!cr&&Date.now()-d.t<45000){cr=uid;inc=d;showCall('in',d.from,d.v)}
    else if(cr===uid&&(!d||d.st==='end'))endCall(false)});
}

/* list */
const row=(t,k,u,s)=>`<div class="row${cur?.id===k?' a':''}" data-o="${t}:${k}">${av(u)}<div><b>${esc(u.name)}</b><br><small>${esc(s)}</small></div></div>`;
function render(){
  const q=$('#q').value.toLowerCase();
  const us=Object.entries(users).filter(([k,u])=>k!==uid&&u.name&&(!q||u.name.toLowerCase().includes(q)||(u.phone||'').includes(q)||(u.id||'').includes(q)));
  const on=us.filter(([,u])=>u.online);
  $('#ol').classList.toggle('hide',!on.length);
  $('#onl').innerHTML=on.map(([k,u])=>`<div class="on" data-o="u:${k}">${av(u)}<small>${esc(u.name.split(' ')[0])}</small></div>`).join('');
  let h;
  if(tab==='c')h=us.map(([k,u])=>row('u',k,u,'ID '+(u.id||'-'))).join('');
  else h='<div class="row" id="ng"><div class="av">＋</div><b>New group</b></div>'+Object.entries(groups).filter(([k,g])=>g.members?.[uid]&&(!q||g.name.toLowerCase().includes(q))).map(([k,g])=>row('g',k,{name:g.name},Object.keys(g.members).length+' members')).join('');
  $('#list').innerHTML=h||'<p class="mut">No one found</p>';
}
$('#q').oninput=render;
$$('.tabs b').forEach(b=>b.onclick=()=>{tab=b.dataset.k;$$('.tabs b').forEach(x=>x.classList.toggle('a',x===b));render()});
$('#side').onclick=e=>{
  if(e.target.closest('#ng'))return newGroup();
  const r=e.target.closest('[data-o]');if(r){const[t,i]=r.dataset.o.split(':');openChat(t,i)}
};

function newGroup(){
  modal('<h3>New group</h3><input class="in" id="gn" placeholder="Group name">'+Object.entries(users).filter(([k,u])=>k!==uid&&u.name).map(([k,u])=>`<label class="row"><input type="checkbox" value="${k}">${esc(u.name)}</label>`).join('')+'<button class="btn" id="gc">Create group</button>');
  $('#gc').onclick=async()=>{
    const n=$('#gn').value.trim(),m={[uid]:true};
    $$('#md input[type=checkbox]:checked').forEach(c=>m[c.value]=true);
    if(!n||Object.keys(m).length<2)return alert('Add a group name and at least one member');
    const r=push(ref(db,'groups'));await set(r,{name:n,by:uid,members:m});md.classList.add('hide');openChat('g',r.key);
  };
}

/* chat */
function hdr(){
  if(!cur)return;const o=cur.t==='u'?users[cur.id]:groups[cur.id];if(!o)return;
  $('#hn').textContent=o.name;$('#ha').innerHTML=av(o);$$('.clb').forEach(b=>b.classList.toggle('hide',cur.t!=='u'));
  $('#hs').textContent=cur.t==='g'?Object.keys(o.members).map(k=>users[k]?.name?.split(' ')[0]).filter(Boolean).join(', '):o.online?'online':o.last?'last seen '+hm(o.last):'offline';
}
function openChat(t,id){
  cur={t,id,c:t==='u'?[uid,id].sort().join('_'):id};
  off&&off();$('#msgs').innerHTML='';
  $('#empty').classList.add('hide');$('#chat').classList.remove('hide');$('#app').classList.add('open');
  hdr();render();
  off=onChildAdded(query(ref(db,'chats/'+cur.c),limitToLast(100)),s=>bubble(s.val()));
}
$('#bk').onclick=()=>{$('#app').classList.remove('open');off&&off();off=null;cur=null;render()};
function bubble(m){
  const mine=m.from===uid,k=m.k;let b;
  if(k==='img')b=`<img src="${m.d}" onload="this.closest('#msgs').scrollTop=1e9">`;
  else if(k==='aud')b=`<audio controls src="${m.d}"></audio>`;
  else if(k==='file')b=`<a href="${m.d}" download="${esc(m.n)}">📄 ${esc(m.n)}</a>`;
  else b=esc(m.d).replace(/\n/g,'<br>');
  const d=document.createElement('div');d.className='m'+(mine?' me':'')+(k==='stk'?' stk':'');
  d.innerHTML=(cur.t==='g'&&!mine?`<b class="sn">${esc(users[m.from]?.name||'?')}</b>`:'')+b+`<div class="t">${hm(m.t)}</div>`;
  const M=$('#msgs');M.append(d);M.scrollTop=M.scrollHeight;
}
const send=(k,d,n)=>cur&&push(ref(db,'chats/'+cur.c),{from:uid,t:serverTimestamp(),k,d,...(n?{n}:{})});
const tg=()=>{const v=!!$('#mi').value.trim();$('#snd').classList.toggle('hide',!v);$('#mic').classList.toggle('hide',v)};
const sendTxt=()=>{const v=$('#mi').value.trim();if(v){send('text',v);$('#mi').value='';tg()}};
$('#mi').oninput=tg;$('#mi').onkeydown=e=>e.key==='Enter'&&sendTxt();$('#snd').onclick=sendTxt;

/* media */
$('#att').onclick=()=>$('#fl').click();
$('#fl').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(f.type.startsWith('image/'))send('img',await img(f,900));
  else if(f.size>1e6)alert('Documents must be under 1 MB');
  else send('file',await b64(f),f.name);
};
$('#mic').onclick=async()=>{
  if(rec)return rec.stop();
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true}),r=new MediaRecorder(s),ch=[];let to;
    r.ondataavailable=e=>ch.push(e.data);
    r.onstop=async()=>{s.getTracks().forEach(t=>t.stop());clearTimeout(to);$('#mic').classList.remove('rc');rec=null;send('aud',await b64(new Blob(ch,{type:r.mimeType})))};
    r.start();rec=r;$('#mic').classList.add('rc');to=setTimeout(()=>r.stop(),6e4);
  }catch{alert('Allow microphone access to send voice notes')}
};
const E='😀 😂 🤣 😊 😍 😘 😎 🤔 😢 😭 😡 🥳 😴 🤯 😇 😈 👻 💀 🔥 ❤️ 🖤 💔 👍 👎 👏 🙏 💪 🤝 🎉 ✨ 💯 🎧 🎵 🍕 ☕ 🌙'.split(' '),
      S='👻 💀 😈 🦇 🕷️ 🧛 🔥 💯 😂 🥹 🫡 🤝 🎧 🍿 ⚡ 🖤'.split(' ');
$('#ep').innerHTML=E.map(e=>`<span>${e}</span>`).join('')+'<h4>Stickers</h4>'+S.map(e=>`<span class="s">${e}</span>`).join('');
$('#ep').onclick=e=>{const s=e.target.closest('span');if(!s)return;if(s.classList.contains('s'))send('stk',s.textContent);else{$('#mi').value+=s.textContent;tg()}};
$('#emo').onclick=()=>$('#ep').classList.toggle('on');

/* calls: WebRTC, signaling through Realtime Database at calls/{calleeUid} */
let pc,ls,cr,inc,ct,un=[];
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
const cref=p=>ref(db,'calls/'+cr+(p?'/'+p:''));
function showCall(m,who,v){
  $('#cav').innerHTML=av(users[who]||{});$('#cnm').textContent=users[who]?.name||'';
  $('#cl').className=(v?'vid ':'')+m;$('#cok').classList.toggle('hide',m!=='in');
  $('#cs').textContent=m==='in'?'Incoming '+(v?'video':'voice')+' call...':m==='out'?'Calling...':'Connected';
}
async function mkPC(v){
  ls=await navigator.mediaDevices.getUserMedia({audio:true,video:v});
  pc=new RTCPeerConnection(ICE);ls.getTracks().forEach(t=>pc.addTrack(t,ls));
  $('#lv').srcObject=ls;pc.ontrack=e=>$('#rv').srcObject=e.streams[0];
  pc.onconnectionstatechange=()=>pc&&pc.connectionState==='failed'&&endCall(true);
}
function endCall(n){
  if(n&&cr)set(cref(),{st:'end',t:Date.now()});
  un.splice(0).forEach(f=>f());clearTimeout(ct);
  const p=pc;pc=null;p&&p.close();ls&&ls.getTracks().forEach(t=>t.stop());
  ls=cr=inc=null;$('#rv').srcObject=$('#lv').srcObject=null;$('#cl').className='hide';
}
async function startCall(v){
  if(cr||cur?.t!=='u')return;cr=cur.id;
  try{await mkPC(v)}catch{endCall(false);return alert('Allow camera/microphone access to call')}
  const o=await pc.createOffer(),od=onDisconnect(cref());
  od.set({st:'end',t:Date.now()});un.push(()=>od.cancel());
  await set(cref(),{from:uid,v,t:Date.now(),st:'ring',offer:{type:o.type,sdp:o.sdp}});
  pc.onicecandidate=e=>e.candidate&&push(cref('cc'),e.candidate.toJSON());
  await pc.setLocalDescription(o);
  showCall('out',cr,v);ct=setTimeout(()=>endCall(true),45000);
  un.push(onValue(cref(),async s=>{const d=s.val();
    if(!d||d.st==='end')return endCall(false);
    if(d.answer&&pc&&!pc._a){pc._a=1;await pc.setRemoteDescription(d.answer);
      un.push(onChildAdded(cref('ce'),x=>pc&&pc.addIceCandidate(x.val())));clearTimeout(ct);showCall('live',cr,v)}}));
}
async function accept(){
  const d=inc;inc=null;
  try{await mkPC(d.v)}catch{endCall(true);return alert('Allow camera/microphone access to answer')}
  pc.onicecandidate=e=>e.candidate&&push(cref('ce'),e.candidate.toJSON());
  await pc.setRemoteDescription(d.offer);
  un.push(onChildAdded(cref('cc'),x=>pc&&pc.addIceCandidate(x.val())));
  const a=await pc.createAnswer();await pc.setLocalDescription(a);
  await update(cref(),{answer:{type:a.type,sdp:a.sdp},st:'live'});
  showCall('live',d.from,d.v);
}
$('#c1').onclick=()=>startCall(false);$('#c2').onclick=()=>startCall(true);
$('#cok').onclick=accept;$('#cno').onclick=()=>endCall(true);
$('#mt').onclick=()=>{const t=ls?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('#mt').textContent=t.enabled?'🎙️':'🔇'}};
</script>
